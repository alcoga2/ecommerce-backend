$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Categoría de prueba",
      "slug": "{{categorySlug}}",
      "description": "Categoría ficticia para Postman",
      "active": true
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('categorySlug', 'postman-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', () => pm.response.to.have.status(201));
      pm.test('Response is JSON', () => pm.response.to.be.json);
      if (pm.response.code === 201) pm.collectionVariables.set('categoryId', pm.response.json().data._id);
    language: text/javascript
order: 1000
