$kind: http-request
url: "{{baseUrl}}/api/categories?active=true&name=Categoría&sort=name&page=1&limit=10"
method: GET
queryParams:
  active: "true"
  name: Categoría
  sort: name
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Includes pagination', () => pm.expect(pm.response.json()).to.have.property('pagination'));
    language: text/javascript
order: 2000
