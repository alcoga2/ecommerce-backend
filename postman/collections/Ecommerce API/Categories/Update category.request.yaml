$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Categoría actualizada desde Postman"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
